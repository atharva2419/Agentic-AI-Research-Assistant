# Alembic configuration. The database URL comes from the app settings (DATABASE_URL), not from
# this file. Run migrations by hand with:   uv run alembic upgrade head
# The app also runs them on startup (app/storage/migrate.py).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
