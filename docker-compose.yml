# docker compose up --build                      live mode (needs keys in .env)
# OFFLINE_MODE=true docker compose up --build    offline demo mode, no keys needed
# APP_PORT=8080 docker compose up --build        if port 8000 is already taken
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false # offline mode works without it
    environment:
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
      # Always keep data on the volume, whatever .env says about local paths.
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/research.db
    volumes:
      - research-data:/data

volumes:
  research-data:
