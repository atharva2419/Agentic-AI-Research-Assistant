# Research workflow blueprint.
#
# This file defines WHAT the agent may do: which steps call the LLM (with which prompt, model and
# effort), which sub-task types the planner may use, and the limits and filters that keep a session
# safe and cheap. The orchestrator code defines HOW (the state machine). Loaded and validated by
# app/blueprint.py; a typo or unknown key fails at startup, not mid-session.

name: research
version: 1
description: Plan, search, filter, summarize, cross-check and synthesize a cited research report.

# Model aliases used by the steps below. Change a model in one place.
models:
  strong: claude-opus-5-5
  balanced: claude-sonnet-5-5
  fast: claude-haiku-5-5

# USD per million tokens, used to estimate session cost and enforce limits.max_cost_usd.
pricing:
  claude-opus-5-5: { input: 4.00, output: 20.00 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00 }
  claude-haiku-5-5: { input: 0.10, output: 0.50 }

# One entry per LLM step. Rule of thumb: one call per stage -> stronger model;
# one call per source -> cheapest model.
steps:
  clarify:     { prompt: clarify.md,     model: balanced, effort: low,    max_tokens: 4000 }
  plan:        { prompt: plan.md,        model: strong,   effort: medium, max_tokens: 16000 }
  relevance:   { prompt: relevance.md,   model: fast,     effort: low,    max_tokens: 4000 }
  summarize:   { prompt: summarize.md,   model: fast,     effort: low,    max_tokens: 4000 }
  cross_check: { prompt: cross_check.md, model: balanced, effort: medium, max_tokens: 8000 }
  gap_check:   { prompt: gap_check.md,   model: balanced, effort: medium, max_tokens: 8000 }
  synthesize:  { prompt: synthesize.md,  model: strong,   effort: medium, max_tokens: 32000 }

# Sub-task types the planner is allowed to use.
allowed_subtask_types: [search, summarize, cross_check]

search:
  provider: tavily
  max_results: 6
  depth: basic # 1 Tavily credit per search

limits:
  max_subtasks: 10
  max_searches: 12
  max_replans: 2
  max_clarifying_questions: 3
  max_gap_questions: 1
  max_sources_summarized: 15
  max_cost_usd: 0.75
  llm_max_retries: 2
  search_timeout_s: 20
  llm_timeout_s: 120
  parallel_searches: 3

filtering:
  default_recency_days: 365
  relevance_threshold: 0.6
  unknown_date_policy: keep_flagged # or: exclude
  min_content_chars: 300
  max_sources_per_domain: 2
  relevance_content_chars: 1500
  summarize_content_chars: 6000
